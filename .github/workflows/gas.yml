name: Build-APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: Peter-Jun-Hee/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: master
      - name: Save
        uses: actions/upload-artifact@v4
        with:
          name: Yudzz-V2-Final
          path: bin/*.apk
